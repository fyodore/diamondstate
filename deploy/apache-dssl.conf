<VirtualHost *:80>
    ServerName dssl.example.com

    DocumentRoot /var/www/dssl
    <Directory /var/www/dssl>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    Alias /media /var/www/dssl-media
    <Directory /var/www/dssl-media>
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/
    ProxyPass /django-admin/ http://127.0.0.1:8000/django-admin/
    ProxyPassReverse /django-admin/ http://127.0.0.1:8000/django-admin/

    ErrorLog ${APACHE_LOG_DIR}/dssl-error.log
    CustomLog ${APACHE_LOG_DIR}/dssl-access.log combined
</VirtualHost>
