# Diamond State Softball League — Apache virtual hosts
# Domains:
#   diamondstatesoftball.org      → React frontend
#   www.diamondstatesoftball.org  → redirect to apex
#   api.diamondstatesoftball.org  → Django/Gunicorn backend
#
# Requires:
#   a2enmod proxy proxy_http headers rewrite
#   Gunicorn listening on 127.0.0.1:8000
#   Frontend build files in DocumentRoot (Vite `npm run build` output)
#
# After DNS is pointed, enable TLS with:
#   certbot --apache -d diamondstatesoftball.org -d www.diamondstatesoftball.org -d api.diamondstatesoftball.org

# ---------------------------------------------------------------------------
# www → apex
# ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName www.diamondstatesoftball.org

    Redirect permanent / http://diamondstatesoftball.org/
</VirtualHost>

# ---------------------------------------------------------------------------
# Frontend — diamondstatesoftball.org
# ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName diamondstatesoftball.org

    DocumentRoot /var/www/diamondstate/frontend

    <Directory /var/www/diamondstate/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # SPA client-side routing (React Router)
        FallbackResource /index.html
    </Directory>

    # Do not send API/static asset requests to index.html
    <Directory /var/www/diamondstate/frontend/assets>
        FallbackResource disabled
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/diamondstate-frontend-error.log
    CustomLog ${APACHE_LOG_DIR}/diamondstate-frontend-access.log combined
</VirtualHost>

# ---------------------------------------------------------------------------
# Backend API — api.diamondstatesoftball.org
# ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName api.diamondstatesoftball.org

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Host "api.diamondstatesoftball.org"

    # Uploaded media (logos, etc.)
    Alias /media /var/www/diamondstate/backend/media
    <Directory /var/www/diamondstate/backend/media>
        Options -Indexes
        Require all granted
    </Directory>

    # Collected Django static files (django-admin CSS/JS, etc.)
    Alias /static /var/www/diamondstate/backend/staticfiles
    <Directory /var/www/diamondstate/backend/staticfiles>
        Options -Indexes
        Require all granted
    </Directory>

    # Do not proxy local aliases to Gunicorn
    ProxyPass /media !
    ProxyPass /static !

    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/diamondstate-api-error.log
    CustomLog ${APACHE_LOG_DIR}/diamondstate-api-access.log combined
</VirtualHost>
